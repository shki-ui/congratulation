<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="aframe.min.js"></script>
    <script src="mindar-image-aframe.prod.js"></script>
    <style>
        #tap-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: white; display: flex;
            justify-content: center; align-items: center;
            z-index: 9999; font-family: sans-serif; font-size: 1.2rem;
            text-align: center; padding: 20px;
            cursor: pointer;
        }
    </style>
    
    <script>
        // Специальный компонент. Он вынесен в Head, чтобы загрузиться до старта сцены.
        AFRAME.registerComponent('sync-transform', {
            schema: { target: {type: 'selector'} },
            init: function () {
                this.isTracking = false;
                const targetEl = this.data.target;
                const videoEl = this.el;
                const videoAsset = document.querySelector(videoEl.getAttribute('src'));

                // Когда маркер найден — запускаем видео и анимацию
                targetEl.addEventListener('targetFound', () => {
                    this.isTracking = true;
                    videoEl.emit('fadein');
                    if (videoAsset) {
                        videoAsset.muted = false;
                        videoAsset.play().catch(() => {});
                    }
                });

                // Когда маркер потерян — мы НЕ ставим на паузу и НЕ скрываем видео.
                // Оно просто перестанет обновлять позицию и зависнет на экране.
                targetEl.addEventListener('targetLost', () => {
                    this.isTracking = false;
                });
            },
            tick: function () {
                // Копируем координаты трекера каждую миллисекунду, пока он в кадре
                if (this.isTracking) {
                    this.el.object3D.position.copy(this.data.target.object3D.position);
                    this.el.object3D.rotation.copy(this.data.target.object3D.rotation);
                    this.el.object3D.scale.copy(this.data.target.object3D.scale);
                }
            }
        });

        // Скрипт разблокировки звука по кнопке
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('tap-overlay');
            const allVideos = document.querySelectorAll('video');

            if (overlay) {
                overlay.addEventListener('click', () => {
                    allVideos.forEach(videoAsset => {
                        videoAsset.muted = true; 
                        videoAsset.play().then(() => {
                            videoAsset.pause();
                            videoAsset.currentTime = 0;
                            videoAsset.muted = false; 
                        }).catch(e => console.log(e));
                    });
                    overlay.style.display = 'none';
                }, {once: true});
            }
        });
    </script>
</head>
<body>
    <div id="tap-overlay">Нажмите на экран,<br>чтобы оживить картинку</div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="video0" src="video0.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <video id="video1" src="video1.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 1. ТРЕКЕРЫ ТЕПЕРЬ ПУСТЫЕ. Они только ищут картинку -->
        <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>

        <!-- 2. ВИДЕО ВЫНЕСЕНЫ ОТДЕЛЬНО. Они привязываются к трекерам через sync-transform -->
        <a-video sync-transform="target: #target0" src="#video0" width="1" height="0.5625" material="transparent: true; opacity: 0" animation="property: material.opacity; to: 1; dur: 1000; startEvents: fadein; easing: easeInOutQuad"></a-video>
        
        <a-video sync-transform="target: #target1" src="#video1" width="1" height="0.5625" material="transparent: true; opacity: 0" animation="property: material.opacity; to: 1; dur: 1000; startEvents: fadein; easing: easeInOutQuad"></a-video>

    </a-scene>
</body>
</html>
