<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="aframe.min.js"></script>
    <script src="mindar-image-aframe.prod.js"></script>
</head>
<body>
    
    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="video0" src="video0.mp4" loop="true" crossorigin="anonymous" muted playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#video0" width="1.0" height="0.8" position="0 0 0" material="transparent: true; opacity: 0;"></a-video>
        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const targetEntities = document.querySelectorAll('[mindar-image-target]');

            targetEntities.forEach((el) => {
                const targetSettings = el.getAttribute('mindar-image-target');
                const index = targetSettings.match(/\d+/)[0];
                
                const videoElement = el.querySelector('a-video');
                const videoAsset = document.querySelector(videoElement.getAttribute('src'));

                el.addEventListener("targetFound", () => {
                    console.log(`Маркер №${index} найден`);
                    videoAsset.play();

                    
                    videoElement.setAttribute('animation', {
                        property: 'material.opacity',
                        to: '1',
                        dur: 600, 
                        easing: 'easeInOutQuad'
                    });
                });

                el.addEventListener("targetLost", () => {
                    console.log(`Маркер №${index} потерян`);
                    videoAsset.pause();

                    
                    videoElement.setAttribute('material', 'opacity', 0);
                
                    videoElement.removeAttribute('animation');
                });
            });

            document.body.addEventListener('click', () => {
                const allVideos = document.querySelectorAll('video');
                allVideos.forEach(v => {
                    v.play();
                    v.pause();
                });
                console.log("Видео-система готова");
            }, {once: true});
        });
    </script>
</body>
</html>
