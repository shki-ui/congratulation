<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="aframe.min.js"></script>
    <script src="mindar-image-aframe.prod.js"></script>
    <style>
        #tap-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: white; display: flex;
            justify-content: center; align-items: center;
            z-index: 9999; font-family: sans-serif; font-size: 1.2rem;
            text-align: center; padding: 20px;
            cursor: pointer;
        }
    </style>
    
    <script>
        // Специальный компонент A-Frame, который запрещает движку прятать видео
        AFRAME.registerComponent('freeze-on-lost', {
            init: function () {
                this.keepVisible = false;
                // Как только маркер найден хотя бы раз, включаем режим удержания
                this.el.addEventListener('targetFound', () => {
                    this.keepVisible = true;
                });
            },
            // Функция tick работает 60 раз в секунду (каждый кадр)
            tick: function () {
                if (this.keepVisible) {
                    // MindAR пытается скрыть объект, но мы принудительно оставляем его видимым
                    this.el.object3D.visible = true;
                }
            }
        });
    </script>
</head>
<body>
    <div id="tap-overlay">Нажмите на экран,<br>чтобы оживить картинку</div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="video0" src="video0.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
            <video id="video1" src="video1.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Добавили наш новый компонент freeze-on-lost к обоим маркерам -->
        <a-entity mindar-image-target="targetIndex: 0" freeze-on-lost>
            <a-video src="#video0" width="1" height="0.5625" position="0 0 0"
                     material="transparent: true; opacity: 0"
                     animation="property: material.opacity; from: 0; to: 1; dur: 1000; startEvents: fadein; easing: easeInOutQuad">
            </a-video>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1" freeze-on-lost>
            <a-video src="#video1" width="1" height="0.5625" position="0 0 0"
                     material="transparent: true; opacity: 0"
                     animation="property: material.opacity; from: 0; to: 1; dur: 1000; startEvents: fadein; easing: easeInOutQuad">
            </a-video>
        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const targetEntities = document.querySelectorAll('[mindar-image-target]');
            const overlay = document.getElementById('tap-overlay');
            
            const isActivated = {};

            targetEntities.forEach((el, index) => {
                isActivated[index] = false; 
                
                const videoElement = el.querySelector('a-video');
                if (!videoElement) return;
                
                const videoId = videoElement.getAttribute('src');
                const videoAsset = document.querySelector(videoId);

                if (videoAsset) {
                    el.addEventListener("targetFound", () => {
                        console.log(`Маркер №${index} найден`);
                        isActivated[index] = true;
                        
                        videoElement.emit('fadein');
                        videoAsset.muted = false;
                        videoAsset.play().catch(e => console.log(e));
                    });

                    // Теперь нам здесь не нужно ничего писать.
                    // Компонент freeze-on-lost сам удержит картинку на экране!
                    el.addEventListener("targetLost", () => {
                        console.log(`Маркер №${index} потерян, но картинка и звук остаются`);
                    });
                }
            });

            if (overlay) {
                overlay.addEventListener('click', () => {
                    targetEntities.forEach((el, index) => {
                        const videoElement = el.querySelector('a-video');
                        if (!videoElement) return;
                        
                        const videoId = videoElement.getAttribute('src');
                        const videoAsset = document.querySelector(videoId);
                        
                        if (videoAsset) {
                            videoAsset.muted = true; 
                            
                            const playPromise = videoAsset.play();
                            if (playPromise !== undefined) {
                                playPromise.then(() => {
                                    if (!isActivated[index]) {
                                        videoAsset.pause();
                                        videoAsset.currentTime = 0;
                                    }
                                    videoAsset.muted = false; 
                                }).catch(e => console.log(e));
                            }
                        }
                    });

                    overlay.style.display = 'none';
                }, {once: true});
            }
        });
    </script>
</body>
</html>
