<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Подключаем надежные версии библиотек напрямую из интернета (CDN) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        /* Экран для разблокировки аудио и видео в браузере */
        #start-overlay {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-size: 20px;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="start-overlay">
        Нажмите на экран для запуска AR<br>и включения звука
    </div>

    <!-- Настройки сцены. Убедитесь, что файл называется строго targets.mind (маленькими буквами) -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Убран crossorigin, добавлены обязательные playsinline и webkit-playsinline -->
            <!-- Убедитесь, что файл называется строго video0.mp4 (маленькими буквами) -->
            <video id="video0" src="video0.mp4" loop="true" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Видео-плоскость. Изначально прозрачная (opacity: 0) -->
            <a-video src="#video0" width="1.6" height="0.9" position="0 0 0" material="transparent: true; opacity: 0;"></a-video>
        </a-entity>
       
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const startOverlay = document.getElementById('start-overlay');
            let isVideoUnlocked = false;

            // 1. Клик по стартовому экрану разблокирует медиа
            startOverlay.addEventListener('click', () => {
                const allVideos = document.querySelectorAll('video');
                allVideos.forEach(v => {
                    v.play().then(() => {
                        v.pause();
                    }).catch(e => console.log("Ожидание маркера...", e));
                });
                isVideoUnlocked = true;
                startOverlay.style.display = 'none';
            });

            const targetEntities = document.querySelectorAll('[mindar-image-target]');

            targetEntities.forEach((el) => {
                const videoElement = el.querySelector('a-video');
                const videoAsset = document.querySelector(videoElement.getAttribute('src'));

                // 2. Действие при наведении камеры на маркер
                el.addEventListener("targetFound", () => {
                    if (isVideoUnlocked) {
                        videoAsset.play();
                        
                        // Анимация плавного появления видео
                        videoElement.setAttribute('animation', {
                            property: 'material.opacity',
                            to: '1',
                            dur: 600,
                            easing: 'easeInOutQuad'
                        });
                    }
                });

                // 3. Действие при потере маркера из вида
                el.addEventListener("targetLost", () => {
                    // Ставим видео на паузу, чтобы звук не шел фоном
                    videoAsset.pause();
                    
                    // Убираем прозрачность, чтобы видео снова плавно появилось при следующем наведении
                    videoElement.setAttribute('animation', {
                        property: 'material.opacity',
                        to: '0',
                        dur: 300,
                        easing: 'easeInOutQuad'
                    });
                });
            });
        });
    </script>
</body>
</html>
