<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        /* Стили для стартового экрана */
        #start-overlay {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-size: 20px;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Стартовый экран блокировки -->
    <div id="start-overlay">
        Нажмите на экран,<br>чтобы разрешить доступ к камере и звуку
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Добавлен атрибут webkit-playsinline для устройств Apple -->
            <video id="video0" src="video0.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Видео с изначальной прозрачностью 0 -->
            <a-video src="#video0" width="1.6" height="0.9" position="0 0 0" material="transparent: true; opacity: 0;"></a-video>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const startOverlay = document.getElementById('start-overlay');
            let isVideoUnlocked = false;

            // 1. Разблокировка видео и звука при первом клике пользователя
            startOverlay.addEventListener('click', () => {
                const allVideos = document.querySelectorAll('video');
                allVideos.forEach(v => {
                    // Пытаемся запустить и сразу ставим на паузу, чтобы звук активировался в системе
                    v.play().then(() => {
                        v.pause();
                    }).catch(e => console.error("Ошибка разблокировки видео:", e));
                });
                isVideoUnlocked = true;
                startOverlay.style.display = 'none'; // Убираем черный экран
                console.log("Видео и звук разблокированы");
            });

            const targetEntities = document.querySelectorAll('[mindar-image-target]');

            targetEntities.forEach((el) => {
                const targetSettings = el.getAttribute('mindar-image-target');
                const index = targetSettings.match(/\d+/)[0];
                
                const videoElement = el.querySelector('a-video');
                const videoAsset = document.querySelector(videoElement.getAttribute('src'));

                // 2. Логика при нахождении маркера
                el.addEventListener("targetFound", () => {
                    console.log(`Маркер №${index} найден`);
                    
                    // Воспроизводим только если пользователь уже прошел стартовый экран
                    if (isVideoUnlocked) {
                        videoAsset.play();

                        // Плавное появление (fade-in)
                        videoElement.setAttribute('animation', {
                            property: 'material.opacity',
                            to: '1',
                            dur: 600,
                            easing: 'easeInOutQuad'
                        });
                    }
                });

                // 3. Логика при потере маркера
                el.addEventListener("targetLost", () => {
                    console.log(`Маркер №${index} потерян, но видео остается на экране`);
                    // Принудительно оставляем видео видимым, отменяя дефолтное поведение MindAR
                    el.object3D.visible = true;
                });
            });
        });
    </script>
</body>
</html>
